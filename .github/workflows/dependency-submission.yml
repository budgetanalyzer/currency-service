name: Dependency Submission

on:
  push:
    branches: [main]
  schedule:
    - cron: '31 5 * * 1'
  workflow_dispatch:

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  submit-gradle-dependencies:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Verify service-common package access
        shell: bash
        env:
          PACKAGES_USERNAME: ${{ secrets.SERVICE_COMMON_PACKAGES_USERNAME }}
          PACKAGES_READ_TOKEN: ${{ secrets.SERVICE_COMMON_PACKAGES_READ_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${PACKAGES_USERNAME}" || -z "${PACKAGES_READ_TOKEN}" ]]; then
            echo "Missing SERVICE_COMMON_PACKAGES_USERNAME or SERVICE_COMMON_PACKAGES_READ_TOKEN." >&2
            exit 1
          fi

          service_common_version="$(sed -n 's/^serviceCommon = "\([^"]*\)"$/\1/p' gradle/libs.versions.toml)"
          if [[ -z "${service_common_version}" ]]; then
            echo "Could not read serviceCommon from gradle/libs.versions.toml." >&2
            exit 1
          fi

          for artifact in spring-cloud-platform service-core service-web; do
            pom_url="https://maven.pkg.github.com/budgetanalyzer/service-common/org/budgetanalyzer/${artifact}/${service_common_version}/${artifact}-${service_common_version}.pom"
            curl --fail --silent --show-error \
              --user "${PACKAGES_USERNAME}:${PACKAGES_READ_TOKEN}" \
              --output /dev/null \
              "${pom_url}"
          done

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        env:
          GITHUB_ACTOR: ${{ secrets.SERVICE_COMMON_PACKAGES_USERNAME }}
          GITHUB_TOKEN: ${{ secrets.SERVICE_COMMON_PACKAGES_READ_TOKEN }}
        with:
          cache-provider: basic
          dependency-graph: generate-and-submit
          additional-arguments: --no-configuration-cache
          github-token: ${{ github.token }}

[versions]
java = "25"
springBoot = "3.5.16"
spotless = "8.0.0"
checkstyle = "12.0.1"
googleJavaFormat = "1.32.0"
jacoco = "0.8.13"
junitPlatform = "1.12.2"
serviceCommon = "0.0.17-SNAPSHOT"

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }

[libraries]
# Spring Boot starters (versions managed by Spring Boot BOM)
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-webflux = { module = "org.springframework.boot:spring-boot-starter-webflux" }
spring-boot-starter-data-redis = { module = "org.springframework.boot:spring-boot-starter-data-redis" }
spring-boot-starter-cache = { module = "org.springframework.boot:spring-boot-starter-cache" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }
spring-security-test = { module = "org.springframework.security:spring-security-test" }

# SpringDoc OpenAPI (version managed by service-common platform)
springdoc-openapi = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui" }

# Spring Cloud (versions managed by Spring Cloud BOM)
spring-cloud-stream = { module = "org.springframework.cloud:spring-cloud-stream" }
spring-cloud-stream-binder-rabbit = { module = "org.springframework.cloud:spring-cloud-stream-binder-rabbit" }

# Spring Modulith (versions managed by service-common platform)
spring-modulith-starter-core = { module = "org.springframework.modulith:spring-modulith-starter-core" }
spring-modulith-starter-jpa = { module = "org.springframework.modulith:spring-modulith-starter-jpa" }
spring-modulith-starter-test = { module = "org.springframework.modulith:spring-modulith-starter-test" }

# Flyway (versions managed by Spring Boot BOM)
flyway-core = { module = "org.flywaydb:flyway-core" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }

# Third-party libraries with versions managed by service-common platform
shedlock-spring = { module = "net.javacrumbs.shedlock:shedlock-spring" }
shedlock-provider-jdbc = { module = "net.javacrumbs.shedlock:shedlock-provider-jdbc-template" }

# Service dependencies
budgetanalyzer-spring-cloud-platform = { module = "org.budgetanalyzer:spring-cloud-platform", version.ref = "serviceCommon" }
service-core = { module = "org.budgetanalyzer:service-core", version.ref = "serviceCommon" }
service-web = { module = "org.budgetanalyzer:service-web", version.ref = "serviceCommon" }

# Runtime dependencies
postgresql = { module = "org.postgresql:postgresql" }
h2 = { module = "com.h2database:h2" }

# Test dependencies
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junitPlatform" }
testcontainers = { module = "org.testcontainers:testcontainers" }
testcontainers-junit-jupiter = { module = "org.testcontainers:junit-jupiter" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql" }
testcontainers-rabbitmq = { module = "org.testcontainers:rabbitmq" }
wiremock-standalone = { module = "org.wiremock:wiremock-standalone" }
awaitility = { module = "org.awaitility:awaitility" }
